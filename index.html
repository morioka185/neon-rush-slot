<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>NEON RUSH - 10,000 RUSH</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="game-container">
        <!-- ヘッダー部分 -->
        <header class="header">
            <div class="header-content">
                <h1 class="game-title neon-text">NEON RUSH</h1>
                <div class="stage-info">
                    <span class="stage-label">STAGE</span>
                    <span class="stage-number" id="stage-display">1</span>
                </div>
            </div>
        </header>

        <!-- メインゲームエリア -->
        <main class="main-game">
            <!-- ゲーム情報パネル -->
            <section class="info-panel">
                <div class="coins-display">
                    <span class="coins-label">COINS</span>
                    <span class="coins-value neon-text" id="coins-display">10,000</span>
                </div>
                <div class="bet-display">
                    <span class="bet-label">BET</span>
                    <span class="bet-value neon-text" id="bet-display">100</span>
                </div>
                <div class="multiplier-display">
                    <span class="multiplier-label">MULTI</span>
                    <span class="multiplier-value neon-text" id="multiplier-display">×1.0</span>
                </div>
            </section>

            <!-- スロットエリア -->
            <section class="slot-area">
                <div class="slot-grid" id="slot-grid">
                    <!-- 3x3グリッド - JavaScriptで動的生成 -->
                    <div class="symbol" data-position="0,0"></div>
                    <div class="symbol" data-position="1,0"></div>
                    <div class="symbol" data-position="2,0"></div>
                    <div class="symbol" data-position="0,1"></div>
                    <div class="symbol" data-position="1,1"></div>
                    <div class="symbol" data-position="2,1"></div>
                    <div class="symbol" data-position="0,2"></div>
                    <div class="symbol" data-position="1,2"></div>
                    <div class="symbol" data-position="2,2"></div>
                </div>

                <!-- ペイライン表示 -->
                <div class="paylines" id="paylines">
                    <!-- ペイライン - JavaScriptで動的生成 -->
                </div>
            </section>

            <!-- コントロールパネル -->
            <section class="control-panel">
                <!-- ベット選択 -->
                <div class="bet-controls">
                    <button class="bet-btn" data-bet="100">100</button>
                    <button class="bet-btn" data-bet="500">500</button>
                    <button class="bet-btn" data-bet="1000">1K</button>
                    <button class="bet-btn" data-bet="5000">5K</button>
                    <button class="bet-btn" data-bet="10000">10K</button>
                    <button class="bet-btn all-in" data-bet="max">ALL IN</button>
                </div>

                <!-- スピンボタン -->
                <div class="spin-control">
                    <button class="spin-btn neon-button" id="spin-button">
                        <span class="spin-text">SPIN</span>
                    </button>
                </div>

                <!-- スキルボタン -->
                <div class="skill-controls">
                    <button class="skill-btn" id="time-freeze-btn" data-skill="timeFreeze">
                        <span class="skill-icon">⏱️</span>
                        <span class="skill-name">TIME<br>FREEZE</span>
                        <span class="skill-count" id="time-freeze-count">1</span>
                    </button>
                    <button class="skill-btn" id="future-vision-btn" data-skill="futureVision">
                        <span class="skill-icon">👁️</span>
                        <span class="skill-name">FUTURE<br>VISION</span>
                        <span class="skill-count" id="future-vision-count">1</span>
                    </button>
                    <button class="skill-btn" id="miracle-spin-btn" data-skill="miracleSpin">
                        <span class="skill-icon">✨</span>
                        <span class="skill-name">MIRACLE<br>SPIN</span>
                        <span class="skill-count" id="miracle-spin-count">1</span>
                    </button>
                </div>
            </section>
        </main>

        <!-- フッター -->
        <footer class="footer">
            <div class="footer-content">
                <div class="heat-gauge">
                    <span class="heat-label">HEAT</span>
                    <div class="heat-bar">
                        <div class="heat-fill" id="heat-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- モーダル・オーバーレイ -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content">
            <!-- モーダルコンテンツは動的に生成 -->
        </div>
    </div>

    <!-- JavaScript読み込み -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
